<div class="pickup-selector">
  <div class="ps-search">
    <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
    <input
      type="text"
      [(ngModel)]="query"
      placeholder="Search pickup location"
      aria-label="Search pickup location"
    />
  </div>

  <button
    type="button"
    class="ps-row"
    [class.selected]="isCurrentSelected()"
    (click)="useCurrentLocation()"
    [attr.aria-label]="'Use current location as pickup point'"
  >
    <span class="ps-icon current"><ion-icon name="locate-outline"></ion-icon></span>
    <span class="ps-text">
      <span class="ps-label">{{ locating ? 'Detecting location…' : 'Use current location' }}</span>
      <span class="ps-sub">
        @if (current) {
          {{ current.label }}@if (current.simulated) { · simulated}
        } @else {
          GPS or saved origin when unavailable
        }
      </span>
    </span>
    @if (isCurrentSelected()) {
      <ion-icon name="checkmark-circle" class="ps-check"></ion-icon>
    }
  </button>

  <div class="ps-group" role="radiogroup" aria-label="Suggested pickup points">
    @for (spot of spots; track spot.id) {
      <button
        type="button"
        role="radio"
        class="ps-row"
        [class.selected]="isSelectedSpot(spot)"
        [attr.aria-checked]="isSelectedSpot(spot)"
        [attr.aria-label]="spot.label + ', ' + spot.sub"
        (click)="chooseSpot(spot)"
      >
        <span class="ps-icon"><ion-icon name="location-outline"></ion-icon></span>
        <span class="ps-text">
          <span class="ps-label">{{ spot.label }}</span>
          <span class="ps-sub">{{ spot.sub }}</span>
        </span>
        @if (distanceFor(spot); as dist) {
          <span class="ps-dist">{{ dist }}</span>
        }
        @if (isSelectedSpot(spot)) {
          <ion-icon name="checkmark-circle" class="ps-check"></ion-icon>
        }
      </button>
    } @empty {
      <p class="ps-empty">No saved places match “{{ query }}”. Try a terminal or city name.</p>
    }
  </div>

  @if (showMapPick) {
    <button
      type="button"
      class="ps-row map-pick"
      [class.selected]="mapPickActive"
      (click)="mapPick.emit()"
      [attr.aria-pressed]="mapPickActive"
      aria-label="Pin pickup point on the map"
    >
      <span class="ps-icon"><ion-icon name="map-outline"></ion-icon></span>
      <span class="ps-text">
        <span class="ps-label">{{ mapPickActive ? 'Tap the map to pin…' : 'Pin on map' }}</span>
        <span class="ps-sub">Drop the pickup exactly where you'll wait</span>
      </span>
    </button>
  }

  <p class="ps-note">Suggested places use saved map data (prototype). Distances are straight-line, not road distance.</p>
</div>
