<ion-content fullscreen class="auth-content">
  <!-- Comic-cover header -->
  <div class="top-section">
    <div class="burst-bg" aria-hidden="true"></div>
    <div class="zoom-word" aria-hidden="true">ZOOM!</div>
    <div class="hero-balloon">
      <span class="hero-kicker">BYAHERO</span>
      <span class="hero-title">Hop on, hero!</span>
      <span class="hero-sub">Buses & UV Express across North Luzon.</span>
    </div>
    <div class="hero-pow" aria-hidden="true"><span>GO!</span></div>
    <svg class="hero-bus" viewBox="0 0 220 120" aria-hidden="true">
      <g class="hb-speed" stroke="#8FA3FF" stroke-linecap="round" fill="none">
        <line x1="4" y1="52" x2="34" y2="52" stroke-width="4" opacity="0.5" />
        <line x1="0" y1="66" x2="28" y2="66" stroke-width="3" opacity="0.4" />
        <line x1="8" y1="80" x2="32" y2="80" stroke-width="3" opacity="0.3" />
      </g>
      <g class="hb-inner">
        <g transform="rotate(-6 120 60)">
          <rect x="34" y="30" width="156" height="54" rx="12" fill="#ffffff" stroke="#060a28" stroke-width="4" />
          <rect x="42" y="38" width="26" height="18" rx="4" fill="#C7D2FE" stroke="#060a28" stroke-width="2.5" />
          <rect x="73" y="38" width="26" height="18" rx="4" fill="#C7D2FE" stroke="#060a28" stroke-width="2.5" />
          <rect x="104" y="38" width="26" height="18" rx="4" fill="#8FA3FF" stroke="#060a28" stroke-width="2.5" />
          <rect x="136" y="36" width="40" height="22" rx="6" fill="#E8EDFF" stroke="#060a28" stroke-width="2.5" />
          <rect x="34" y="68" width="156" height="10" rx="5" fill="#D32F2F" />
          <circle cx="182" cy="60" r="5" fill="#FFE066" stroke="#060a28" stroke-width="2.5" />
          <circle cx="70" cy="86" r="13" fill="#060a28" />
          <circle cx="70" cy="86" r="5" fill="#CBD5E1" />
          <circle cx="152" cy="86" r="13" fill="#060a28" />
          <circle cx="152" cy="86" r="5" fill="#CBD5E1" />
        </g>
      </g>
      <polygon class="hb-spark" points="204,8 205.8,13.4 211.2,15 205.8,16.6 204,22 202.2,16.6 196.8,15 202.2,13.4" fill="#FFE066" />
    </svg>
  </div>

  <!-- Bottom Sheet (Gray Card) -->
  <div class="bottom-sheet">
    <!-- Overlapping Logo -->
    <div class="logo-circle">
      <span class="logo-sticker" aria-hidden="true">HI!</span>
      <svg class="logo-burst" viewBox="0 0 160 160" aria-hidden="true">
        <g
          stroke="#151D48"
          stroke-width="3"
          opacity="0.14"
          stroke-linecap="round"
        >
          <line x1="80" y1="4" x2="80" y2="22" />
          <line x1="80" y1="138" x2="80" y2="156" />
          <line x1="4" y1="80" x2="22" y2="80" />
          <line x1="138" y1="80" x2="156" y2="80" />
          <line x1="24" y1="24" x2="37" y2="37" />
          <line x1="123" y1="123" x2="136" y2="136" />
          <line x1="24" y1="136" x2="37" y2="123" />
          <line x1="123" y1="37" x2="136" y2="24" />
        </g>
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 400 400"
        class="logo-svg"
      >
        <rect x="100" y="70" width="200" height="260" rx="50" fill="#151D48" />
        <path
          d="M 115 150 Q 150 130 200 150 Q 250 130 285 150 L 270 190 Q 200 170 130 190 Z"
          fill="#FFFFFF"
        />
        <path
          d="M 100 220 L 300 220 L 300 280 Q 200 350 100 280 Z"
          fill="#DC2626"
        />
        <circle cx="200" cy="265" r="18" fill="#FFFFFF" />
        <circle cx="200" cy="265" r="8" fill="#151D48" />
        <rect x="196" y="340" width="8" height="40" rx="4" fill="#151D48" />
      </svg>
    </div>

    <!-- Drag Handle -->
    <div class="drag-handle"></div>

    <div class="header-text">
      <h1>Welcome back</h1>
      <p>Log in to catch your next ride.</p>
    </div>

    <form class="auth-form">
      <!-- Input 1: Email -->
      <div class="input-group">
        <label>Email address</label>
        <div class="pill-input">
          <ion-icon name="mail-outline"></ion-icon>
          <ion-input
            type="email"
            placeholder="juan@example.com"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
          >
          </ion-input>
        </div>
      </div>

      <!-- Input 2: Password -->
      <div class="input-group">
        <label>Password</label>
        <div class="pill-input">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter your password"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
          >
          </ion-input>
          <ion-icon
            class="toggle-icon"
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            (click)="showPassword = !showPassword"
          >
          </ion-icon>
        </div>
      </div>

      <div class="forgot-row">
        <button type="button" (click)="forgotPassword()">Forgot password?</button>
      </div>

      <!-- Primary Button -->
      <button type="button" class="primary-cta" (click)="login()">
        <span>Log In</span>
      </button>
    </form>

    <!-- Social Login Section -->
    <div class="divider">
      <div class="line"></div>
      <span>or continue with</span>
      <div class="line"></div>
    </div>

    <div class="social-row">
      <button type="button" class="social-btn" (click)="continueWith('Google')">
        <ion-icon name="logo-google"></ion-icon>
      </button>
      <button type="button" class="social-btn" (click)="continueWith('Apple')">
        <ion-icon name="logo-apple"></ion-icon>
      </button>
      <button type="button" class="social-btn" (click)="continueWith('Facebook')">
        <ion-icon name="logo-facebook"></ion-icon>
      </button>
    </div>

    <!-- Switch Auth Link -->
    <p class="switch-auth">
      New to byaHERO? <a routerLink="/signup">Create an account</a>
    </p>
  </div>
</ion-content>
