<ion-content fullscreen class="edit-content">
  <div class="edit-wrap">
    <!-- TOP BAR -->
    <div class="top-bar">
      <button class="round-btn" (click)="goBack()" aria-label="Go back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1>Edit profile</h1>
    </div>

    <!-- LIVE ID PREVIEW -->
    <section class="id-panel">
      <div class="id-dots"></div>
      <div class="id-avatar">
        <span class="rays"></span>
        <img [src]="avatarSrc" alt="Your avatar preview" />
      </div>
      <div class="id-text">
        <span class="tag">Live preview</span>
        <h2>{{ draft.name.trim() || 'Your name' }}</h2>
        <span class="hero-id">
          @if (user.verified) {
            <ion-icon name="shield-checkmark-outline"></ion-icon>
          }
          {{ user.heroId }}
        </span>
      </div>
      <div class="id-stub">
        <span>Since</span>
        <strong>{{ user.memberSince }}</strong>
      </div>
    </section>

    <!-- AVATAR PICKER -->
    <section class="block">
      <div class="section-head">
        <h3>Pick your look</h3>
        <span class="rule"></span>
      </div>

      <div class="avatar-grid">
        <button
          class="tile"
          [class.on]="avatarChoice === 'default'"
          (click)="choose('default')"
          aria-label="Classic avatar"
        >
          <img [src]="defaultAvatar" alt="" />
        </button>

        @for (src of options; track $index; let i = $index) {
          <button
            class="tile"
            [class.on]="avatarChoice === i"
            (click)="choose(i)"
            [attr.aria-label]="'Avatar style ' + (i + 1)"
          >
            <img [src]="src" alt="" />
          </button>
        }

        <button
          class="tile upload"
          [class.on]="avatarChoice === 'upload'"
          (click)="picker.click()"
          aria-label="Upload a photo"
        >
          <ion-icon name="camera-outline"></ion-icon>
          <span>Upload</span>
        </button>
      </div>
      <input
        #picker
        type="file"
        accept="image/*"
        hidden
        (change)="onFile($event)"
      />
    </section>

    <!-- BASICS -->
    <section class="block">
      <div class="section-head">
        <h3>The basics</h3>
        <span class="rule"></span>
      </div>

      <label class="field" [class.bad]="touched.name && nameError">
        <span class="f-label">Full name</span>
        <input
          type="text"
          autocomplete="name"
          maxlength="40"
          placeholder="Juan Dela Cruz"
          [value]="draft.name"
          (input)="onName($event)"
          (blur)="touched.name = true"
        />
        @if (touched.name && nameError) {
          <span class="err">{{ nameError }}</span>
        }
      </label>

      <label class="field" [class.bad]="touched.phone && phoneError">
        <span class="f-label">Mobile number</span>
        <input
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          placeholder="0917 123 4567"
          [value]="draft.phone"
          (input)="onPhone($event)"
          (blur)="formatPhone()"
        />
        @if (touched.phone && phoneError) {
          <span class="err">{{ phoneError }}</span>
        }
      </label>

      <label class="field" [class.bad]="touched.email && emailError">
        <span class="f-label">Email</span>
        <input
          type="email"
          inputmode="email"
          autocomplete="email"
          autocapitalize="off"
          placeholder="you@email.com"
          [value]="draft.email"
          (input)="onEmail($event)"
          (blur)="touched.email = true"
        />
        @if (touched.email && emailError) {
          <span class="err">{{ emailError }}</span>
        }
      </label>

      <div class="locked">
        <span class="f-label">Hero ID</span>
        <strong>{{ user.heroId }}</strong>
        <span class="hint">Assigned to you. It can't be changed.</span>
      </div>
    </section>
  </div>

  <!-- ACTION BAR -->
  <div class="action-bar">
    <button class="btn ghost" (click)="goBack()">
      {{ dirty ? 'Discard' : 'Close' }}
    </button>
    <button class="btn primary" [disabled]="!dirty" (click)="save()">
      <ion-icon name="checkmark-outline"></ion-icon>Save changes
    </button>
  </div>
</ion-content>
