<ion-content fullscreen class="sub-content">
  <div class="page">
    <div class="top-bar">
      <button class="round-btn" (click)="goBack()" aria-label="Go back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <div class="bar-text">
        <h1>Dark Mode</h1>
        <p>Easier on the eyes at night</p>
      </div>
      <span class="beacon"><ion-icon [name]="on ? 'moon-outline' : 'sunny-outline'"></ion-icon></span>
    </div>

    <!-- MASTER SWITCH -->
    <section class="switch-card">
      <span class="sc-icon"><ion-icon [name]="on ? 'moon-outline' : 'sunny-outline'"></ion-icon></span>
      <div class="sc-text">
        <h2>Dark Mode</h2>
        <p>{{ on ? 'Night mode is on' : 'Light theme is active' }}</p>
      </div>
      <button
        class="switch"
        [class.on]="on"
        role="switch"
        [attr.aria-checked]="on"
        (click)="toggle(!on)"
      >
        <span class="knob"></span>
      </button>
    </section>

    <!-- PREVIEW -->
    <section class="block">
      <div class="section-head">
        <h3>Preview</h3>
        <span class="rule"></span>
      </div>
      <div class="preview" [class.dark]="on" (click)="toggle(!on)">
        <div class="pv-head"></div>
        <div class="pv-body">
          <span class="pv-box"></span>
          <div class="pv-lines">
            <i></i>
            <i></i>
          </div>
        </div>
      </div>
      <p class="hint">
        <ion-icon name="eye-outline"></ion-icon>
        Tap the preview to flip the theme. Follows the whole app.
      </p>
    </section>
  </div>
</ion-content>
