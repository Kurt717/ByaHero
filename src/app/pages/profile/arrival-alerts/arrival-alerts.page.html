<ion-content fullscreen class="sub-content">
  <div class="page">
    <div class="top-bar">
      <button class="round-btn" (click)="goBack()" aria-label="Go back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <div class="bar-text">
        <h1>Arrival Alerts</h1>
        <p>Never miss your stop</p>
      </div>
      <span class="beacon"><ion-icon name="notifications-outline"></ion-icon></span>
    </div>

    <!-- MASTER SWITCH -->
    <section class="switch-card">
      <span class="sc-icon"><ion-icon name="location-outline"></ion-icon></span>
      <div class="sc-text">
        <h2>Arrival Alerts</h2>
        <p>{{ on ? 'We ping you before your stop' : 'Alerts are off' }}</p>
      </div>
      <button
        class="switch"
        [class.on]="on"
        role="switch"
        [attr.aria-checked]="on"
        (click)="toggle(!on)"
      >
        <span class="knob"></span>
      </button>
    </section>

    <!-- NOTES -->
    <section class="block">
      <div class="section-head">
        <h3>When you get notified</h3>
        <span class="rule"></span>
      </div>
      <div class="note-chip">2 km before your stop</div>
      <div class="note-chip">When the bus departs</div>
      <div class="note-chip">10 minutes before arrival</div>
    </section>
  </div>
</ion-content>
