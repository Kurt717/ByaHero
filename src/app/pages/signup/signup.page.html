<ion-content fullscreen class="auth-content">
  <!-- Top White Background Area -->
  <div class="top-section">
    <!-- <ion-button class="back-btn" fill="clear" (click)="goBack()">
      <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
    </ion-button> -->
  </div>

  <!-- Bottom Sheet (Gray Card) -->
  <div class="bottom-sheet">
    
    <!-- Overlapping Logo -->
    <div class="logo-circle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="logo-svg">
        <rect x="100" y="70" width="200" height="260" rx="50" fill="#1E3A8A"/>
        <path d="M 115 150 Q 150 130 200 150 Q 250 130 285 150 L 270 190 Q 200 170 130 190 Z" fill="#FFFFFF"/>
        <path d="M 100 220 L 300 220 L 300 280 Q 200 350 100 280 Z" fill="#DC2626"/>
        <circle cx="200" cy="265" r="18" fill="#FFFFFF"/>
        <circle cx="200" cy="265" r="8" fill="#1E3A8A"/>
        <rect x="196" y="340" width="8" height="40" rx="4" fill="#1E3A8A"/>
      </svg>
    </div>

    <!-- Wireframe Drag Handle -->
    <div class="drag-handle"></div>

    <div class="header-text">
      <h1>Create Account</h1>
      <p>Join commuters riding smarter across North Luzon.</p>
    </div>

    <form class="auth-form">
      
      <!-- Input 1 -->
      <div class="input-group">
        <label>Full name</label>
        <div class="pill-input">
          <ion-icon name="person-outline"></ion-icon>
          <ion-input
            type="text"
            placeholder="e.g. Juan Dela Cruz"
            [(ngModel)]="fullName"
            name="fullName"
            autocomplete="name">
          </ion-input>
        </div>
      </div>

      <!-- Input 2 -->
      <div class="input-group">
        <label>Email address</label>
        <div class="pill-input">
          <ion-icon name="mail-outline"></ion-icon>
          <ion-input
            type="email"
            placeholder="juan@example.com"
            [(ngModel)]="email"
            name="email"
            autocomplete="email">
          </ion-input>
        </div>
      </div>

      <!-- Input 3 -->
      <div class="input-group">
        <label>Mobile number</label>
        <div class="pill-input">
          <ion-icon name="call-outline"></ion-icon>
          <ion-input
            type="tel"
            placeholder="+63 900 000 0000"
            [(ngModel)]="mobile"
            name="mobile"
            autocomplete="tel">
          </ion-input>
        </div>
      </div>

      <!-- Input 4 -->
      <div class="input-group">
        <label>Password</label>
        <div class="pill-input">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Create a strong password"
            [(ngModel)]="password"
            name="password"
            autocomplete="new-password">
          </ion-input>
          <ion-icon
            class="toggle-icon"
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            (click)="showPassword = !showPassword">
          </ion-icon>
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div class="terms-row">
        <ion-checkbox [(ngModel)]="agreedToTerms" name="agreedToTerms"></ion-checkbox>
        <span class="terms-label">
          I agree to the <a>Terms of Service</a> & <a>Privacy Policy</a>
        </span>
      </div>

      <!-- Primary Button -->
      <button class="primary-cta" (click)="createAccount()">
        Create Account
      </button>
    </form>

    <!-- Social Login Section matching the wireframe -->
    <div class="divider">
      <div class="line"></div>
      <span>or sign up with</span>
      <div class="line"></div>
    </div>

    <div class="social-row">
      <button class="social-btn"><ion-icon name="logo-google"></ion-icon></button>
      <button class="social-btn"><ion-icon name="logo-apple"></ion-icon></button>
      <button class="social-btn"><ion-icon name="logo-facebook"></ion-icon></button>
    </div>

    <!-- Login Link -->
    <p class="switch-auth">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>

  </div>
</ion-content>
