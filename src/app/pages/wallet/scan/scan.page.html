<ion-content fullscreen class="w-content">
  <div class="w-shell">

    <header class="w-app">
      <button type="button" class="w-back" (click)="goBack()" aria-label="Go back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1 class="w-title">Scan / Pay</h1>
      <span class="w-spacer"></span>
    </header>

    <!-- VIEWFINDER -->
    <section class="vf" [class.active]="scanning" (click)="simulateScan()" role="button" tabindex="0" (keydown.enter)="simulateScan()">
      <span class="vf-c tl"></span>
      <span class="vf-c tr"></span>
      <span class="vf-c bl"></span>
      <span class="vf-c br"></span>

      @if (scanning) {
        <span class="vf-line"></span>
      }

      <span class="vf-hint">
        <ion-icon name="scan-outline"></ion-icon>
        Scan a ByaHero QR code
      </span>
    </section>

    <p class="vf-text">
      Scan a ByaHero QR code to pay
    </p>

    <div class="or"><span>or</span></div>

    <!-- FALLBACKS -->
    <div class="fb-grid">
      <button type="button" class="fb-item" (click)="uploadQr()">
        <span class="fb-icon"><ion-icon name="image-outline"></ion-icon></span>
        <span class="fb-label">Upload QR</span>
      </button>
      <button type="button" class="fb-item" (click)="toggleCode()">
        <span class="fb-icon"><ion-icon name="keypad-outline"></ion-icon></span>
        <span class="fb-label">Enter payment code</span>
      </button>
    </div>

    <!-- CODE ENTRY -->
    @if (codeMode) {
      <div class="code-box">
        <p class="cb-label">PAYMENT CODE</p>
        <input
          class="cb-input"
          type="text"
          inputmode="text"
          placeholder="e.g. BYH-4821"
          [(ngModel)]="code"
        />
        <button type="button" class="cb-btn" (click)="verifyCode()">
          <ion-icon name="checkmark-circle"></ion-icon>
          Verify Code
        </button>
      </div>
    }

  </div>
</ion-content>
