<ion-content fullscreen class="w-content">
  <div class="w-shell">

    <header class="w-app">
      <button type="button" class="w-back" (click)="goBack()" aria-label="Go back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1 class="w-title">Wallet Settings</h1>
      <span class="w-spacer"></span>
    </header>

    <!-- SECURITY -->
    <section class="group">
      <h2 class="grp-title">Wallet Security</h2>

      <div class="grp-card">
        <button type="button" class="g-item" (click)="security[0].go!()">
          <span class="g-icon"><ion-icon [name]="security[0].icon"></ion-icon></span>
          <span class="g-body">
            <span class="g-label">{{ security[0].label }}</span>
            @if (security[0].sub) {
              <span class="g-sub">{{ security[0].sub }}</span>
            }
          </span>
          <ion-icon name="chevron-forward-outline" class="g-chev"></ion-icon>
        </button>

        <div class="g-item g-toggle">
          <span class="g-icon"><ion-icon name="fingerprint-outline"></ion-icon></span>
          <span class="g-body">
            <span class="g-label">Biometric Auth</span>
            <span class="g-sub">Unlock payments with your fingerprint</span>
          </span>
          <button
            type="button"
            class="w-switch"
            [class.on]="biometric"
            role="switch"
            [attr.aria-checked]="biometric"
            aria-label="Toggle biometric auth"
            (click)="onToggle('bio', !biometric)"
          >
            <span class="w-knob"></span>
          </button>
        </div>

        <div class="g-item g-toggle">
          <span class="g-icon"><ion-icon name="notifications-outline"></ion-icon></span>
          <span class="g-body">
            <span class="g-label">Security Notifications</span>
            <span class="g-sub">Alerts for new logins & transfers</span>
          </span>
          <button
            type="button"
            class="w-switch"
            [class.on]="securityNotif"
            role="switch"
            [attr.aria-checked]="securityNotif"
            aria-label="Toggle security notifications"
            (click)="onToggle('notif', !securityNotif)"
          >
            <span class="w-knob"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- ACCOUNT -->
    <section class="group">
      <h2 class="grp-title">Account</h2>
      <div class="grp-card">
        @for (a of account; track a.label) {
          <button type="button" class="g-item" (click)="a.go!()">
            <span class="g-icon"><ion-icon [name]="a.icon"></ion-icon></span>
            <span class="g-body">
              <span class="g-label">{{ a.label }}</span>
              @if (a.sub) {
                <span class="g-sub">{{ a.sub }}</span>
              }
            </span>
            <ion-icon name="chevron-forward-outline" class="g-chev"></ion-icon>
          </button>
        }
      </div>
    </section>

    <!-- SUPPORT -->
    <section class="group">
      <h2 class="grp-title">Support</h2>
      <div class="grp-card">
        @for (s of support; track s.label) {
          <button type="button" class="g-item" (click)="s.go!()">
            <span class="g-icon g-red"><ion-icon [name]="s.icon"></ion-icon></span>
            <span class="g-body">
              <span class="g-label">{{ s.label }}</span>
              @if (s.sub) {
                <span class="g-sub">{{ s.sub }}</span>
              }
            </span>
            <ion-icon name="chevron-forward-outline" class="g-chev"></ion-icon>
          </button>
        }
      </div>
    </section>

    <p class="foot">ByaHero Wallet v1.0 · Fare ID BYH-KF-0482</p>

  </div>
</ion-content>
