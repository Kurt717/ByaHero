<ion-content fullscreen class="w-content">
  <div class="w-shell">

    <header class="w-app">
      <button type="button" class="w-back" (click)="goBack()" aria-label="Go back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1 class="w-title">Transactions</h1>
      <span class="w-spacer"></span>
    </header>

    <!-- FILTERS -->
    <div class="filters" role="tablist" aria-label="Filter transactions">
      @for (f of filters; track f.id) {
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="filter === f.id"
          class="flt"
          [class.on]="filter === f.id"
          (click)="setFilter(f.id)"
        >
          {{ f.label }}
        </button>
      }
    </div>

    <!-- GROUPS -->
    @for (g of groups; track g.label) {
      @if (filtered(g.txns).length) {
        <section class="day">
          <div class="day-head">
            <span class="day-dot"></span>
            <span class="day-label">{{ g.label }}</span>
          </div>

          <div class="txn-list">
            @for (t of filtered(g.txns); track t.id) {
              <button type="button" class="txn-item" (click)="open(t)">
                <span class="txn-icon" [class.in]="t.amount >= 0">
                  <ion-icon [name]="iconFor(t)"></ion-icon>
                </span>
                <span class="txn-main">
                  <span class="txn-title">{{ t.title }}</span>
                  <span class="txn-sub">{{ t.subtitle }}</span>
                  <span class="txn-meta">{{ t.date }} · {{ t.time }} · {{ t.status === 'success' ? 'Success' : t.status }}</span>
                </span>
                <span class="txn-side">
                  <span class="txn-amount" [class.in]="t.amount >= 0">
                    {{ t.amount >= 0 ? '+' : '−' }}{{ formatAmount(t.amount) }}
                  </span>
                  <ion-icon name="chevron-forward-outline" class="txn-chev"></ion-icon>
                </span>
              </button>
            }
          </div>
        </section>
      }
    }

    @if (empty) {
      <div class="empty-box">
        <p class="empty-title">No transactions found</p>
        <p class="empty-sub">Try a different filter, or add money to start.</p>
      </div>
    }

  </div>
</ion-content>
