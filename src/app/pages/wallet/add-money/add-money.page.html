<ion-content fullscreen class="w-content">
  <div class="w-shell">

    <header class="w-app">
      <button type="button" class="w-back" (click)="goBack()" aria-label="Go back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1 class="w-title">Add Money</h1>
      <span class="w-spacer"></span>
    </header>

    <!-- AMOUNT INPUT -->
    <section class="amount-card">
      <p class="ac-label">ENTER AMOUNT</p>
      <div class="ac-field">
        <span class="ac-peso">₱</span>
        <input
          class="ac-input"
          type="number"
          inputmode="numeric"
          min="1"
          step="1"
          [(ngModel)]="amount"
          (ngModelChange)="onAmountChange($event)"
          aria-label="Amount to add"
        />
      </div>

      <div class="ac-quick">
        @for (n of quickAmounts; track n) {
          <button
            type="button"
            class="ac-chip"
            [class.on]="amount === n"
            (click)="setAmount(n)"
          >
            ₱{{ n.toLocaleString('en-PH') }}
          </button>
        }
      </div>
    </section>

    <!-- PAYMENT SOURCE -->
    <section class="step-label">PAY USING</section>

    <div class="src-list" role="radiogroup" aria-label="Payment source">
      @for (src of sources; track src.value) {
        <button
          type="button"
          role="radio"
          aria-checked="selected === src.value"
          class="src-item"
          [class.on]="selected === src.value"
          (click)="selected = src.value"
        >
          <span class="src-radio">
            @if (selected === src.value) {
              <ion-icon name="checkmark-circle"></ion-icon>
            }
          </span>
          <span class="src-icon"><ion-icon [name]="src.icon"></ion-icon></span>
          <span class="src-body">
            <span class="src-label">{{ src.label }}</span>
            <span class="src-sub">{{ src.sub }}</span>
          </span>
        </button>
      }
    </div>

    <p class="secure-note">
      <ion-icon name="lock-closed-outline"></ion-icon>
      Your details are encrypted. You'll confirm before money moves.
    </p>

    <!-- CONTINUE -->
    <button
      type="button"
      class="w-cta"
      [disabled]="!canContinue"
      (click)="continueToReview()"
    >
      Continue
    </button>

  </div>
</ion-content>
