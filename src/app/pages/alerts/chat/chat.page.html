@if (chat; as c) {
  <ion-content fullscreen class="chat-content">
    <!-- STICKY HEADER -->
    <div class="sticky-top">
      <div class="sticky-inner">
        <div class="head-row">
          <button class="round-btn" (click)="goBack()" aria-label="Back to chats">
            <ion-icon name="arrow-back-outline"></ion-icon>
          </button>

          <div class="avatar" [ngClass]="c.avatarType">
            <svg class="avatar-burst" viewBox="0 0 80 80" aria-hidden="true">
              <g stroke="#8FA3FF" stroke-width="2" opacity="0.5" stroke-linecap="round">
                <line x1="40" y1="4" x2="40" y2="12" />
                <line x1="40" y1="68" x2="40" y2="76" />
                <line x1="4" y1="40" x2="12" y2="40" />
                <line x1="68" y1="40" x2="76" y2="40" />
                <line x1="14" y1="14" x2="19" y2="19" />
                <line x1="61" y1="61" x2="66" y2="66" />
                <line x1="14" y1="66" x2="19" y2="61" />
                <line x1="61" y1="19" x2="66" y2="14" />
              </g>
            </svg>
            <span class="face"
              ><ion-icon [name]="avatarIcon(c.avatarType)"></ion-icon
            ></span>
            @if (c.live) {
              <span class="live-dot"></span>
            }
          </div>

          <div class="who">
            <h1>{{ c.name }}</h1>
            <p>{{ c.presence }}</p>
          </div>
        </div>

        <button class="context" (click)="openContext()">
          <span class="ctx-icon"
            ><ion-icon
              [name]="c.context.kind === 'live' ? 'navigate-outline' : 'ticket-outline'"
            ></ion-icon
          ></span>
          <span class="ctx-text">
            <strong>{{ contextTitle }}</strong>
            <small>{{ contextSub }}</small>
          </span>
          <span class="ctx-cta"
            >{{ c.context.cta }}<ion-icon name="arrow-forward-outline"></ion-icon
          ></span>
        </button>
      </div>
    </div>

    <!-- THREAD -->
    <div class="thread">
      @for (g of groups; track g.day) {
        <div class="day-caption"><span>{{ g.day }}</span></div>

        @for (m of g.items; track m.id) {
          <div class="row" [class.me]="m.from === 'me'" [class.tail]="m.tail">
            <div class="bubble"><p>{{ m.text }}</p></div>
            @if (m.tail) {
              <span class="meta"
                >{{ m.time }}@if (m.from === 'me' && m.read) { · Seen }</span
              >
            }
          </div>
        }
      }

      @if (typing) {
        <div class="row typing tail" aria-label="Typing">
          <div class="bubble"><span></span><span></span><span></span></div>
        </div>
      }
    </div>
  </ion-content>

  <ion-footer class="ion-no-border">
    <div class="dock">
      <div class="dock-inner">
        <div class="quick">
          @for (q of c.quick; track q) {
            <button class="chip" (click)="useQuick(q)">{{ q }}</button>
          }
        </div>
        <div class="composer">
          <textarea
            #field
            rows="1"
            placeholder="Write a message"
            aria-label="Message"
            [value]="draft"
            (input)="onInput($event)"
            (keydown.enter)="onEnter($event)"
          ></textarea>
          <button
            class="send"
            [disabled]="!draft.trim()"
            (click)="send()"
            aria-label="Send message"
          >
            <ion-icon name="send"></ion-icon>
          </button>
        </div>
      </div>
    </div>
  </ion-footer>
}
