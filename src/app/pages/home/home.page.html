<ion-content fullscreen class="home-content">
  <!-- Deep Blue Header Background (Image 2 Color Scheme) -->
  <div class="header-bg-block">
    <svg class="visor-arc" viewBox="0 0 150 150" aria-hidden="true">
      <defs>
        <linearGradient id="visorWash" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#5B7CFF" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#5B7CFF" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- Manga-style focus lines, kept faint -->
      <g stroke="#8FA3FF" stroke-width="1.5" opacity="0.28">
        <line x1="75" y1="75" x2="8" y2="140"/>
        <line x1="75" y1="75" x2="140" y2="132"/>
        <line x1="75" y1="75" x2="142" y2="18"/>
        <line x1="75" y1="75" x2="26" y2="4"/>
      </g>
      <!-- The logo's route-line curve, zoomed in and layered like a visor/windshield glint -->
      <rect x="8" y="8" width="134" height="134" rx="38" fill="url(#visorWash)"/>
      <path d="M18 58 Q75 18 132 58 Q75 96 18 58 Z" fill="#02040F" opacity="0.45"/>
      <path d="M27 52 Q75 27 123 52 Q75 70 27 52 Z" fill="#8FA3FF" opacity="0.55"/>
      <path d="M40 46 Q75 34 110 46 Q75 55 40 46 Z" fill="#FFFFFF" opacity="0.32"/>
    </svg>
    <svg class="header-seam" viewBox="0 0 340 60" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,42 Q42.5,14 85,42 Q127.5,14 170,42 Q212.5,14 255,42 Q297.5,14 340,42 L340,60 L0,60 Z" fill="var(--bg-page)"/>
      <g fill="#AFC0FF" opacity="0.9">
        <polygon points="6,0 7.32,4.2 12,6 7.32,7.8 6,12 4.68,7.8 0,6 4.68,4.2" transform="translate(80,16) scale(0.9)"/>
        <polygon points="6,0 7.32,4.2 12,6 7.32,7.8 6,12 4.68,7.8 0,6 4.68,4.2" transform="translate(165,14) scale(0.7)"/>
        <polygon points="6,0 7.32,4.2 12,6 7.32,7.8 6,12 4.68,7.8 0,6 4.68,4.2" transform="translate(250,16) scale(0.9)"/>
      </g>
    </svg>
  </div>

  <div class="home-wrap">

    <!-- 1. HEADER -->
    <div class="page-header">
      <div class="user-profile">
        <ion-avatar class="avatar">
          <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="User" />
        </ion-avatar>
        <div class="greeting">
          <span class="greeting-sub">Good morning,</span>
          <h2 class="greeting-name">{{ userName }}</h2>
        </div>
      </div>
      <button class="notif-btn" aria-label="Notifications">
        <div class="notif-icon-wrap">
          <ion-icon name="notifications-outline"></ion-icon>
          <span class="badge"></span>
        </div>
      </button>
    </div>

    <!-- 2. ROUTE SELECTORS (Flat, Bordered Pills) -->
    <div class="route-selectors">
      <!-- Primary Route Pill -->
      <div class="pill-card primary-route">
        <div class="input-half">
          <div class="route-dot origin-dot"></div>
          <input type="text" [(ngModel)]="origin" placeholder="Origin" />
        </div>
        <div class="separator-icon">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
        <div class="input-half">
          <div class="route-dot dest-dot"></div>
          <input type="text" [(ngModel)]="destination" placeholder="Destination" />
        </div>
      </div>

      <!-- Secondary Info Pill (Solid Red) -->
      <div class="pill-card secondary-info" (click)="viewLiveTrip()">
        <div class="info-left">
          <div class="status-indicator"></div>
          <span>View Active Trip</span>
        </div>
        <ion-icon name="chevron-forward-outline" class="forward-icon"></ion-icon>
      </div>
    </div>

    <!-- 3. CATEGORIES -->
    <div class="categories-grid">
      <div class="cat-item active">
        <div class="squircle"><ion-icon name="bus-outline"></ion-icon></div>
        <span class="cat-label">Bus</span>
      </div>
      <div class="cat-item">
        <div class="squircle"><ion-icon name="car-sport-outline"></ion-icon></div>
        <span class="cat-label">UV Exp</span>
      </div>
      <div class="cat-item">
        <div class="squircle"><ion-icon name="people-outline"></ion-icon></div>
        <span class="cat-label">Shared</span>
      </div>
      <div class="cat-item">
        <div class="squircle"><ion-icon name="compass-outline"></ion-icon></div>
        <span class="cat-label">All</span>
      </div>
    </div>

    <!-- 4. SEGMENTED TOGGLE & FILTERS -->
    <div class="view-toggle-wrapper">
      <div class="segmented-control">
        <button
          class="seg-btn"
          [class.active]="selectedView === 'list'"
          (click)="toggleMapView('list')">
          <ion-icon name="list-outline"></ion-icon>
          <span>List View</span>
        </button>
        <button
          class="seg-btn"
          [class.active]="selectedView === 'map'"
          (click)="toggleMapView('map')">
          <ion-icon name="map-outline"></ion-icon>
          <span>Map View</span>
        </button>
      </div>

      <div class="filter-row">
        <span class="filter-pill active">Fastest</span>
        <span class="filter-pill">Cheapest</span>
        <span class="filter-pill">Rated</span>
      </div>
    </div>

    <!-- 5A. LIST VIEW -->
    <div class="content-viewport list-viewport" *ngIf="selectedView === 'list'">
      <div class="trip-card" *ngFor="let route of nearbyRoutes; let i = index">
        <div class="fastest-tag" *ngIf="i === 0">
          <ion-icon name="star-sharp"></ion-icon>
          <span>Fastest pick</span>
        </div>
        <div class="card-top">
          <div class="operator-info">
            <div class="op-logo"><ion-icon name="bus"></ion-icon></div>
            <div class="op-text">
              <h4>{{ route.operator }}</h4>
              <p>{{ route.eta }} • {{ route.status }}</p>
            </div>
          </div>
          <span class="fare">{{ route.fare }}</span>
        </div>
        <div class="card-middle">
          <div class="route-line-vertical">
            <span class="dot origin"></span>
            <span class="line"></span>
            <span class="dot dest"></span>
          </div>
          <div class="route-text">
            <p><strong>{{ route.from }}</strong></p>
            <p class="dest-text"><strong>{{ route.to }}</strong></p>
          </div>
        </div>
        <div class="card-bottom">
          <span class="seats">{{ route.seats }}</span>
          <button class="book-btn" (click)="bookTrip(route)">Select</button>
        </div>
      </div>
    </div>

    <!-- 5B. MAP VIEW (real Leaflet + OpenStreetMap) -->
    <div class="content-viewport map-viewport" [hidden]="selectedView !== 'map'">
      <div class="map-shell">
        <div #mapEl class="leaflet-host"></div>

        <div class="map-legend">
          <span class="legend-dot navy"></span>On-time
          <span class="legend-dot red"></span>Delayed
        </div>

        <button class="fab-locate" [class.loading]="locating" (click)="locateMe()" aria-label="Find my location">
          <ion-icon name="locate-outline"></ion-icon>
        </button>

        <span class="locate-toast" *ngIf="locateMessage">{{ locateMessage }}</span>
      </div>
    </div>

  </div>
</ion-content>
