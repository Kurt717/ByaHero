<ion-content class="splash-content" [scrollY]="false">
  <div class="splash-container">
    <div class="logo-wrapper fade-in-scale">
      <svg class="logo-burst" viewBox="0 0 220 220" aria-hidden="true">
        <g stroke="#151D48" stroke-width="3" opacity="0.16" stroke-linecap="round">
          <line x1="110" y1="6" x2="110" y2="28"/>
          <line x1="110" y1="192" x2="110" y2="214"/>
          <line x1="6" y1="110" x2="28" y2="110"/>
          <line x1="192" y1="110" x2="214" y2="110"/>
          <line x1="34" y1="34" x2="50" y2="50"/>
          <line x1="170" y1="170" x2="186" y2="186"/>
          <line x1="34" y1="186" x2="50" y2="170"/>
          <line x1="170" y1="50" x2="186" y2="34"/>
        </g>
        <g stroke="#DC2626" stroke-width="2" opacity="0.12" stroke-linecap="round">
          <line x1="110" y1="16" x2="110" y2="34" transform="rotate(22 110 110)"/>
          <line x1="110" y1="16" x2="110" y2="34" transform="rotate(67 110 110)"/>
          <line x1="110" y1="16" x2="110" y2="34" transform="rotate(112 110 110)"/>
          <line x1="110" y1="16" x2="110" y2="34" transform="rotate(157 110 110)"/>
          <line x1="110" y1="16" x2="110" y2="34" transform="rotate(202 110 110)"/>
          <line x1="110" y1="16" x2="110" y2="34" transform="rotate(247 110 110)"/>
          <line x1="110" y1="16" x2="110" y2="34" transform="rotate(292 110 110)"/>
          <line x1="110" y1="16" x2="110" y2="34" transform="rotate(337 110 110)"/>
        </g>
      </svg>
      <!-- Your exact SVG Logo -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" class="logo-svg-main">
        <rect width="400" height="400" style="fill-opacity: 0; fill: none;"/>
        <rect x="100" y="70" width="200" height="260" rx="50" fill="#151D48"/>
        <path d="M 115 150 Q 150 130 200 150 Q 250 130 285 150 L 270 190 Q 200 170 130 190 Z" fill="#FFFFFF"/>
        <path d="M 100 220 L 300 220 L 300 280 Q 200 350 100 280 Z" fill="#DC2626"/>
        <circle cx="200" cy="265" r="18" fill="#FFFFFF"/>
        <circle cx="200" cy="265" r="8" fill="#151D48"/>
        <rect x="196" y="340" width="8" height="40" rx="4" fill="#151D48"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1 class="fade-in-up title-anim">bya<span>Hero</span></h1>
      <p class="fade-in-up subtitle-anim">Your hero on the way.</p>
    </div>
  </div>
</ion-content>
